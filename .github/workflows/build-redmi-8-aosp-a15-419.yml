name: Build /e/OS/ v4.4.2-a16 Compatible Kernel (Mi439) with KSU-Next & SUSFS

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "redmi_8_eos"
  DEVICE_CODENAME : "olive"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/JackA1ltman/android_kernel_xiaomi_sdm439-4.19.git"
  KERNEL_BRANCH : "ksu-next"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "lineageos_mi439_defconfig"
  
  DEFCONFIG_FROM_BOOT: "true"
  
  BOOT_SOURCE : "https://github.com/xxgbrl/NonGKI_Kernel_Build_2nd/releases/download/v4.4.2-a16/boot.img"
  DEFCONFIG_ORIGIN_IMAGE: "https://github.com/xxgbrl/NonGKI_Kernel_Build_2nd/releases/download/v4.4.2-a16/boot.img"

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "next" 

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  PACK_METHOD: "AnyKernel3"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "eos_a16_4.19_ksunext"
  PYTHON_VERSION: "3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "redmi_8_419"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "xiaomi-sdm439"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: /e/OS/ v4.4.2-a16 (Mi439) Kernel 4.19
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🔧 Disable vdso32 compilation completely
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Kosongkan vdso32 Makefile agar tidak mengkompilasi apa-apa
          echo "# Disabled for Clang compatibility" > arch/arm64/kernel/vdso32/Makefile
          echo "obj-y :=" >> arch/arm64/kernel/vdso32/Makefile

          # Buat file dummy vdso32-offsets.h
          mkdir -p include/generated
          echo "/* Dummy file - vdso32 disabled */" > include/generated/vdso32-offsets.h

          echo "[+] vdso32 completely disabled with dummy offsets file"

      - name: 🧩 Fix NO_HZ scheduler config
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"

          echo "[+] Fixing NO_HZ config in $DEFCONFIG"
          test -f "$DEFCONFIG"

          grep -v -E '^(CONFIG_NO_HZ|CONFIG_NO_HZ_IDLE|CONFIG_NO_HZ_FULL|CONFIG_NO_HZ_COMMON|CONFIG_HZ_PERIODIC|CONFIG_HIGH_RES_TIMERS|CONFIG_TICK_ONESHOT|# CONFIG_NO_HZ|# CONFIG_HZ_PERIODIC|# CONFIG_HIGH_RES_TIMERS|# CONFIG_TICK_ONESHOT)' \
            "$DEFCONFIG" > "$DEFCONFIG.tmp"
          mv "$DEFCONFIG.tmp" "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<'EOF'

          # NO_HZ scheduler fix
          CONFIG_TICK_ONESHOT=y
          CONFIG_HIGH_RES_TIMERS=y
          CONFIG_NO_HZ=y
          CONFIG_NO_HZ_COMMON=y
          CONFIG_NO_HZ_IDLE=y
          # CONFIG_NO_HZ_FULL is not set
          # CONFIG_HZ_PERIODIC is not set
          EOF

          sed -i 's/^          //' "$DEFCONFIG"

          echo "[+] Current NO_HZ config:"
          grep -E 'CONFIG_NO_HZ|CONFIG_HZ_PERIODIC|CONFIG_HIGH_RES_TIMERS|CONFIG_TICK_ONESHOT' "$DEFCONFIG" || true

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
